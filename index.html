<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Información para visitar la muestra Artimañas 2026 en La Plata." />
  <title>Cómo llegar | Artimañas 2026</title>
  <link rel="stylesheet" href="css/ticket.css" />
</head>
<body>
  <main class="ticket-scene">
    <button class="ticket-close" type="button" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5 19 19M19 5 5 19" /></svg>
    </button>

    <section class="ticket-section" aria-labelledby="ticket-title">
      <h1 id="ticket-title" class="visually-hidden">Artimañas 2026: información de la muestra</h1>

      <img
        class="ticket-landscape"
        src="assets/images/ticket-muestra.png"
        alt="Artimañas. Muestra de trabajos finales de Taller de Diseño Multimedial V. 28 de noviembre, 19:00 horas. Sede Fonseca de la Facultad de Artes, Diagonal 78 N.º 680, La Plata, Buenos Aires, Argentina."
        width="2048"
        height="853"
      />

      <div class="ticket-portrait" aria-hidden="true">
        <div class="ticket-main">
          <div>
            <h2>Artimañas</h2>
            <p class="ticket-description">Muestra de trabajos finales de Taller de Diseño Multimedial V</p>
          </div>
          <div class="ticket-details">
            <p class="ticket-emphasis">28 de Noviembre * 19:00 hrs</p>
            <p class="ticket-emphasis">Sede Fonseca de la Facultad de artes</p>
            <p>Diagonal 78 N.º 680</p>
            <p>La Plata, Buenos Aires, Argentina</p>
          </div>
        </div>
        <div class="ticket-stub">
          <p>EDICIÓN 2026</p>
          <div class="ticket-barcode"></div>
          <span>0 13456 00000 0</span>
        </div>
      </div>

      <a class="ticket-directions" href="https://www.google.com/maps/dir/?api=1&amp;destination=Sede%20Fonseca%20Facultad%20de%20Artes%2C%20Diagonal%2078%20680%2C%20La%20Plata%2C%20Buenos%20Aires%2C%20Argentina" target="_blank" rel="noopener noreferrer">Ver cómo llegar</a>
    </section>
  </main>
</body>
</html>
