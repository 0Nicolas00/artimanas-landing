<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Landing page de Artimañas" />
  <title>Artimañas</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="#inicio">Artimañas</a>

      <nav class="site-nav" aria-label="Navegación principal">
        <a href="#inicio">Inicio</a>
        <a href="#proyecto">Proyecto</a>
        <a href="#contenido">Contenido</a>
        <a href="#contacto">Contacto</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="inicio" class="section hero">
      <div class="hero-background" aria-hidden="true">
        <!--
          Fondo vectorial reconstruido a partir de Frame 55.
          Las 13 elipses usan la geometría del Figma y escalan sin pixelarse.
        -->
        <svg
          class="hero-gradient-svg"
          viewBox="0 0 1440 900"
          preserveAspectRatio="xMidYMid slice"
          xmlns="http://www.w3.org/2000/svg"
        >
          <defs>
            <radialGradient id="leftOuter" cx="68%" cy="50%" r="72%">
              <stop offset="0%" stop-color="#ef5d48" />
              <stop offset="42%" stop-color="#eb4869" />
              <stop offset="68%" stop-color="#d335a1" />
              <stop offset="100%" stop-color="#8f23d6" stop-opacity="0" />
            </radialGradient>

            <radialGradient id="leftOrange" cx="70%" cy="50%" r="68%">
              <stop offset="0%" stop-color="#f46f3e" />
              <stop offset="48%" stop-color="#f16043" />
              <stop offset="76%" stop-color="#e24274" />
              <stop offset="100%" stop-color="#bc2bc0" stop-opacity="0" />
            </radialGradient>

            <radialGradient id="leftWarm" cx="72%" cy="50%" r="66%">
              <stop offset="0%" stop-color="#f47741" />
              <stop offset="58%" stop-color="#f0634d" />
              <stop offset="100%" stop-color="#e44b7d" stop-opacity="0" />
            </radialGradient>

            <radialGradient id="leftPeach" cx="74%" cy="50%" r="65%">
              <stop offset="0%" stop-color="#ffdcd1" />
              <stop offset="38%" stop-color="#ffc1b9" />
              <stop offset="72%" stop-color="#f98c86" />
              <stop offset="100%" stop-color="#ed6688" stop-opacity="0" />
            </radialGradient>

            <radialGradient id="leftLight" cx="78%" cy="50%" r="64%">
              <stop offset="0%" stop-color="#fff5f5" />
              <stop offset="46%" stop-color="#fce4eb" />
              <stop offset="78%" stop-color="#f4b8cf" />
              <stop offset="100%" stop-color="#e980b0" stop-opacity="0" />
            </radialGradient>

            <radialGradient id="rightOuter" cx="38%" cy="50%" r="72%">
              <stop offset="0%" stop-color="#c827d3" />
              <stop offset="44%" stop-color="#a51fe3" />
              <stop offset="72%" stop-color="#7419e8" />
              <stop offset="100%" stop-color="#4f16d1" stop-opacity="0" />
            </radialGradient>

            <radialGradient id="rightPink" cx="34%" cy="50%" r="69%">
              <stop offset="0%" stop-color="#ec397e" />
              <stop offset="44%" stop-color="#dc32a0" />
              <stop offset="74%" stop-color="#bd28c8" />
              <stop offset="100%" stop-color="#8c20e0" stop-opacity="0" />
            </radialGradient>

            <radialGradient id="rightCoral" cx="28%" cy="50%" r="67%">
              <stop offset="0%" stop-color="#f36d3d" />
              <stop offset="46%" stop-color="#ed554a" />
              <stop offset="72%" stop-color="#df3f72" />
              <stop offset="100%" stop-color="#c52aaa" stop-opacity="0" />
            </radialGradient>

            <radialGradient id="rightHot" cx="18%" cy="50%" r="64%">
              <stop offset="0%" stop-color="#f87943" />
              <stop offset="48%" stop-color="#ef584e" />
              <stop offset="78%" stop-color="#dc3a7d" />
              <stop offset="100%" stop-color="#bd28b8" stop-opacity="0" />
            </radialGradient>

            <linearGradient id="centerDark" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#11110d" />
              <stop offset="38%" stop-color="#111019" />
              <stop offset="52%" stop-color="#0b0920" />
              <stop offset="72%" stop-color="#0f0e17" />
              <stop offset="100%" stop-color="#12120f" />
            </linearGradient>

            <filter id="blurLarge" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="42" />
            </filter>
            <filter id="blurMedium" x="-25%" y="-25%" width="150%" height="150%">
              <feGaussianBlur stdDeviation="28" />
            </filter>
            <filter id="blurSmall" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="18" />
            </filter>
            <filter id="centerBlur" x="-40%" y="-20%" width="180%" height="140%">
              <feGaussianBlur stdDeviation="30" />
            </filter>
            <filter id="grain" x="0" y="0" width="100%" height="100%">
              <feTurbulence
                type="fractalNoise"
                baseFrequency="0.78"
                numOctaves="4"
                seed="9"
                stitchTiles="stitch"
              />
              <feColorMatrix type="saturate" values="0" />
            </filter>
          </defs>

          <rect width="1440" height="900" fill="#3415ae" />

          <!-- Grupo izquierdo: geometría tomada de Frame 55. -->
          <ellipse cx="92.086" cy="502.206" rx="570.507" ry="761.166" fill="url(#leftOuter)" filter="url(#blurLarge)" />
          <ellipse cx="87.673" cy="482.596" rx="557.273" ry="526.886" fill="url(#leftOrange)" filter="url(#blurMedium)" />
          <ellipse cx="261.176" cy="482.113" rx="372.006" ry="397.983" fill="url(#leftWarm)" filter="url(#blurMedium)" />
          <ellipse cx="356.751" cy="482.107" rx="276.431" ry="336.227" fill="url(#leftPeach)" filter="url(#blurSmall)" />
          <ellipse cx="477.810" cy="474.271" rx="155.370" ry="276.431" fill="url(#leftLight)" filter="url(#blurSmall)" />
          <ellipse cx="448.898" cy="474.271" rx="184.288" ry="276.431" fill="url(#leftLight)" opacity="0.48" filter="url(#blurSmall)" />

          <!-- Grupo derecho: geometría tomada de Frame 55. -->
          <ellipse cx="1208.096" cy="450.250" rx="604.326" ry="856.250" fill="url(#rightOuter)" filter="url(#blurLarge)" />
          <ellipse cx="1244.363" cy="474.756" rx="557.273" ry="646.476" fill="url(#rightPink)" filter="url(#blurMedium)" />
          <ellipse cx="1122.979" cy="467.090" rx="422.979" ry="467.090" fill="url(#rightPink)" filter="url(#blurMedium)" />
          <ellipse cx="1064.494" cy="482.113" rx="364.654" ry="397.983" fill="url(#rightCoral)" filter="url(#blurMedium)" />
          <ellipse cx="976.271" cy="482.107" rx="276.431" ry="336.227" fill="url(#rightHot)" filter="url(#blurSmall)" />
          <ellipse cx="845.408" cy="474.261" rx="145.568" ry="276.431" fill="url(#rightHot)" opacity="0.82" filter="url(#blurSmall)" />
          <ellipse cx="881.188" cy="474.271" rx="184.288" ry="276.431" fill="url(#rightHot)" opacity="0.56" filter="url(#blurSmall)" />

          <!-- La zona oscura central se forma entre ambos grupos en el original. -->
          <path
            d="M560 -90 C640 95 692 245 706 410 C711 457 711 505 703 554 C680 699 626 842 548 990 L858 990 C790 842 746 698 728 554 C722 506 722 458 732 410 C759 245 815 94 904 -90 Z"
            fill="url(#centerDark)"
            filter="url(#centerBlur)"
          />

          <!-- Grano sutil, también vector/procedural. -->
          <rect
            width="1440"
            height="900"
            filter="url(#grain)"
            opacity="0.105"
            class="hero-grain"
          />
        </svg>
      </div>

      <div class="container hero-content">
        <p class="eyebrow">Artimañas</p>
        <h1>Landing page</h1>
        <p>Prueba de fondo interactivo siguiendo el movimiento del mouse.</p>
      </div>
    </section>

    <section id="proyecto" class="section">
      <div class="container">
        <h2>Proyecto</h2>
      </div>
    </section>

    <section id="contenido" class="section">
      <div class="container">
        <h2>Contenido</h2>
      </div>
    </section>

    <section id="contacto" class="section">
      <div class="container">
        <h2>Contacto</h2>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Artimañas</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
