<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Landing page de Artimañas" />
  <title>Artimañas</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="site-nav" aria-label="Navegación principal">
      <a href="#obras">Obras</a>
      <a href="#galeria">Galería</a>
      <a href="#muestra-2026">Muestra 2026</a>
    </nav>
  </header>

  <main>
    <section id="inicio" class="section hero">
      <div class="hero-background" aria-hidden="true">
        <img
          class="hero-background-image"
          src="assets/images/fondo-hero.png"
          alt=""
          draggable="false"
        />
      </div>

      <div class="container hero-content">
        <p class="eyebrow">Artimañas</p>
        <h1>Landing page</h1>
        <p>Prueba de fondo interactivo siguiendo el movimiento del mouse.</p>
      </div>
    </section>

    <section id="obras" class="section">
      <div class="container">
        <h2>Obras</h2>
      </div>
    </section>

    <section id="galeria" class="section">
      <div class="container">
        <h2>Galería</h2>
      </div>
    </section>

    <section id="muestra-2026" class="section">
      <div class="container">
        <h2>Muestra 2026</h2>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Artimañas</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
