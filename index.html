<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Fotos de la muestra Artimañas 2026" />
  <title>Galería | Artimañas</title>
  <link rel="stylesheet" href="css/galeria.css" />
</head>
<body>
  <main>
    <section id="galeria" class="photo-gallery" aria-labelledby="gallery-title">
      <h1 id="gallery-title" class="photo-gallery-title">Galería de la muestra Artimañas</h1>
      <div class="photo-gallery-grid" data-gallery-grid></div>
      <p class="photo-gallery-empty" data-gallery-empty>Las fotos de Artimañas estarán disponibles después de la muestra.</p>

      <div class="photo-gallery-lightbox" data-gallery-lightbox role="dialog" aria-modal="true" aria-label="Foto ampliada de la muestra" hidden>
        <button class="photo-gallery-button photo-gallery-close" type="button" data-gallery-close aria-label="Cerrar foto">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg>
        </button>
        <div class="photo-gallery-viewer">
          <button class="photo-gallery-button" type="button" data-gallery-previous aria-label="Foto anterior"></button>
          <img class="photo-gallery-full" data-gallery-full alt="" />
          <button class="photo-gallery-button" type="button" data-gallery-next aria-label="Foto siguiente"></button>
        </div>
        <div class="photo-gallery-actions">
          <a class="photo-gallery-download" data-gallery-download href="#" download>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v13m-5-5 5 5 5-5M4 17v4h16v-4"/></svg>
            Descargar
          </a>
        </div>
      </div>
    </section>
  </main>
  <script src="js/galeria.js"></script>
</body>
</html>
